[project]
name = "pr-referee"
version = "0.1.0"
description = "A code reviewer that only reports what it can prove, and measures itself against an LLM reviewer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["code-review", "differential-testing", "mutation-testing", "static-analysis", "llm", "ci"]
# No runtime dependencies. A tool whose claim is "every finding is reproducible" should
# not ask you to trust a dependency tree in order to believe it.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[project.scripts]
pr-referee = "pr_referee.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_referee"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
